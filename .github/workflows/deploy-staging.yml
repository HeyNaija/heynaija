# Every push to `staging` that passes CI is built and deployed to staging. Once it
# is running, its images are tagged with the code's tree for production to ship
# (deploy-production.yml). Roll back by running this workflow on an earlier commit
# (Run workflow, then pick a branch or tag), or on the server:
# infra/deploy/deploy.sh <commit>.
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      build_images: false

  images:
    needs: check
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to staging
    needs: images
    # HeyNaija's own runner on the staging server (docs/deployment/staging.md).
    runs-on: [self-hosted, heynaija-staging]
    environment: staging
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy ${{ github.sha }}
        env:
          IMAGE_PREFIX: ${{ needs.images.outputs.image_prefix }}
          DEPLOY_REF: ${{ github.sha }}
        # Load this release's script, including on the first deploy of a change
        # to deploy.sh. A running Bash script cannot update its own instructions.
        run: |
          cd /srv/heynaija
          git fetch --quiet origin
          git -c advice.detachedHead=false checkout --quiet --detach "$DEPLOY_REF"
          exec bash infra/deploy/deploy.sh "$DEPLOY_REF"

  # Tags the images staged-<tree>, with the tree of the code rather than the commit:
  # a merge from staging into main makes a new commit with the same tree, so
  # production finds these images and deploys them as they are, without testing
  # or building that code again. Only after the deploy, so that only images that
  # started and answered on staging get the tag.
  staged:
    name: Mark the images as running on staging
    needs: [images, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Adds a tag in the registry; nothing is downloaded or rebuilt. Without
      # --prefer-index=false, a single image is wrapped in a new index with a new
      # digest. Kratos's image is already tagged with the contents of infra/kratos.
      - name: Tag the API and web images
        env:
          IMAGE_PREFIX: ${{ needs.images.outputs.image_prefix }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          for app in api web; do
            docker buildx imagetools create --prefer-index=false \
              --tag "$IMAGE_PREFIX-$app:staged-$tree" "$IMAGE_PREFIX-$app:$GITHUB_SHA"
          done
