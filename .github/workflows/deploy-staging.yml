# Every push to `staging` that passes CI is built and deployed to staging. Once it
# is running, its images are tagged with the code's tree for production to ship
# (deploy-production.yml). Roll back by running this workflow on an earlier commit
# (Run workflow, then pick a branch or tag), or on the server:
# infra/deploy/deploy.sh <commit>.
name: Deploy staging

on:
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push waits rather than cancelling one mid-way.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    with:
      build_images: false

  images:
    needs: check
    uses: ./.github/workflows/build-images.yml
    permissions:
      contents: read
      packages: write

  deploy:
    name: Deploy to staging
    needs: images
    # On GitHub's machines, over SSH to the staging server with a key that can only
    # run infra/deploy/ssh-deploy.sh there (docs/deployment/staging.md, step 4). No
    # runner on the server: in a public repository, anyone's pull request could run
    # code on one.
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy ${{ github.sha }}
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The server pulls the images with this job's token, sent on standard input.
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n%s\n' "$GITHUB_ACTOR" "$REGISTRY_TOKEN" | ssh -i ~/.ssh/deploy -p "${DEPLOY_SSH_PORT:-22}" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=30 -o ServerAliveInterval=30 \
            "heynaija@$DEPLOY_HOST" deploy "$GITHUB_SHA"

  # Tags the images staged-<tree>, with the tree of the code rather than the commit:
  # a merge from staging into main makes a new commit with the same tree, so
  # production finds these images and deploys them as they are, without testing
  # or building that code again. Only after the deploy, so that only images that
  # started and answered on staging get the tag.
  staged:
    name: Mark the images as running on staging
    needs: [images, deploy]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Adds a tag in the registry; nothing is downloaded or rebuilt. Without
      # --prefer-index=false, a single image is wrapped in a new index with a new
      # digest. Kratos's image is already tagged with the contents of infra/kratos.
      - name: Tag the API and web images
        env:
          IMAGE_PREFIX: ${{ needs.images.outputs.image_prefix }}
        run: |
          tree=$(git rev-parse 'HEAD^{tree}')
          for app in api web; do
            docker buildx imagetools create --prefer-index=false \
              --tag "$IMAGE_PREFIX-$app:staged-$tree" "$IMAGE_PREFIX-$app:$GITHUB_SHA"
          done
