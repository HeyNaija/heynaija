# Builds the API, web, video worker and authentication images on GitHub's machines
# and pushes them to GitHub's container registry: the API, web and video worker
# images tagged with the commit, Kratos's with the contents of infra/kratos. Called
# by the deploy workflows, so the servers only ever pull images and never spend
# memory building them.
name: Build images

on:
  workflow_call:
    outputs:
      image_prefix:
        description: Where the images are, e.g. ghcr.io/owner/heynaija
        value: ${{ jobs.build.outputs.image_prefix }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_prefix: ${{ steps.prefix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # The registry wants lower case; GitHub owner names may not be.
      - id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/heynaija" >> "$GITHUB_OUTPUT"

      # Kratos's image is tagged with the contents of infra/kratos rather than the
      # commit, so a release that leaves those files alone does not restart it.
      # deploy.sh works out the same tag.
      - id: kratos
        run: echo "tag=$(git rev-parse HEAD:infra/kratos)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.prefix.outputs.value }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.prefix.outputs.value }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # The API's code plus ffmpeg (the Dockerfile's video-worker target), for the servers
      # that run the video worker (COMPOSE_PROFILES=video, docs/video-spike.md). Built on
      # every release, so a Debian update that drops the pinned ffmpeg fails here, before
      # any server is touched. It starts from the API image just built, so that part is cached.
      - name: Video worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: video-worker
          push: true
          tags: ${{ steps.prefix.outputs.value }}-video-worker:${{ github.sha }}
          cache-from: |
            type=gha,scope=api
            type=gha,scope=video-worker
          cache-to: type=gha,scope=video-worker,mode=max

      - name: Authentication image
        uses: docker/build-push-action@v6
        with:
          context: infra/kratos
          push: true
          tags: ${{ steps.prefix.outputs.value }}-kratos:${{ steps.kratos.outputs.tag }}
          cache-from: type=gha,scope=kratos
          cache-to: type=gha,scope=kratos,mode=max
