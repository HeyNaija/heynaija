# Builds the API, web and authentication images on GitHub's machines and pushes them to GitHub's
# container registry, tagged with the commit. Called by the deploy workflows, so
# the servers only ever pull images and never spend memory building them.
name: Build images

on:
  workflow_call:
    outputs:
      image_prefix:
        description: Where the images are, e.g. ghcr.io/owner/heynaija
        value: ${{ jobs.build.outputs.image_prefix }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      image_prefix: ${{ steps.prefix.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      # The registry wants lower case; GitHub owner names may not be.
      - id: prefix
        run: echo "value=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/heynaija" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: api
          push: true
          tags: ${{ steps.prefix.outputs.value }}-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: web
          push: true
          tags: ${{ steps.prefix.outputs.value }}-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      - name: Authentication image
        uses: docker/build-push-action@v6
        with:
          context: infra/kratos
          push: true
          tags: ${{ steps.prefix.outputs.value }}-kratos:${{ github.sha }}
          cache-from: type=gha,scope=kratos
          cache-to: type=gha,scope=kratos,mode=max
