name: CI

# Pushes to staging and main run this through their deploy workflows instead,
# which deploy only if it passes.
on:
  push:
    branches-ignore: [main, staging]
  pull_request:
  workflow_call:
    inputs:
      build_images:
        description: Also check that the Docker images build (the deploy workflows build them anyway)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: heynaija
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: heynaija_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U heynaija"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://heynaija:ci-only@localhost:5432/heynaija_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm audit --prod --audit-level high

  # The deploy images, so a change that breaks the Docker build is caught here
  # rather than when deploying.
  images:
    if: inputs.build_images != false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --target api .
      - run: docker buildx build --target web .
