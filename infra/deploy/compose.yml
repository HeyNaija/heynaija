# HeyNaija on one server: staging (shared with Koinovera) or production.
# Everything runs on a private Docker network. The only published port is the web
# app's, on 127.0.0.1, for the server's nginx to proxy to (nginx/heynaija.conf).
# Settings and secrets come from infra/deploy/.env (see .env.example and
# docs/deployment/). Deploy with ./deploy.sh or the GitHub workflows, not by hand.
#
# COMPOSE_PROJECT_NAME in .env (heynaija-staging, heynaija-production) keeps this
# deployment's containers, network and volumes apart from anything else on the server.
name: heynaija

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

x-api-env: &api-env
  # development | staging | production: picks each feature flag's default
  # (docs/feature-flags.md). Anything unset is production, the safe side.
  APP_ENV: ${APP_ENV:-production}
  DATABASE_URL: postgres://heynaija:${POSTGRES_PASSWORD:?}@postgres:5432/heynaija
  # Connections the API keeps open to Postgres (packages/db). 20 suits one API
  # process on the production server, well under Postgres's 100.
  DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-20}
  REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379
  KRATOS_PUBLIC_URL: http://kratos:4433
  # Members' email addresses are kept by Kratos; the API asks its admin API, which
  # is reachable only on this private network, when it sends a notification email.
  KRATOS_ADMIN_URL: http://kratos:4434
  KRATOS_WEBHOOK_SECRET: ${KRATOS_WEBHOOK_SECRET:?}
  # Notification emails go out through the same account as Kratos's sign-in codes.
  SMTP_CONNECTION_URI: ${SMTP_CONNECTION_URI:?}
  SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:?}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-HeyNaija}
  # Push notifications; without the keys nothing is pushed. Push services reach us
  # at WEB_PUBLIC_URL (docs/adr/0011).
  PUSH_VAPID_PUBLIC_KEY: ${PUSH_VAPID_PUBLIC_KEY:-}
  PUSH_VAPID_PRIVATE_KEY: ${PUSH_VAPID_PRIVATE_KEY:-}
  WEB_PUBLIC_URL: ${SITE_URL:?}
  # Calls and Gists (docs/adr/0017). All optional: empty means off, and with the
  # switches false every Gists route answers 404. There is no media server on
  # these hosts; LIVEKIT_URL points at its own server once one exists.
  CALLS_ENABLED: ${CALLS_ENABLED:-false}
  CALLS_GISTS_ENABLED: ${CALLS_GISTS_ENABLED:-false}
  CALLS_MEMBERS: ${CALLS_MEMBERS:-}
  LIVEKIT_URL: ${LIVEKIT_URL:-}
  LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
  LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
  LIVEKIT_WEBHOOK_KEY: ${LIVEKIT_WEBHOOK_KEY:-}
  LIVEKIT_WEBHOOK_SECRET: ${LIVEKIT_WEBHOOK_SECRET:-}
  # Age verification with Didit (docs/deployment/age-verification.md). All four (with IDENTITY_KEY_SECRET) or
  # none; with any empty no check is offered and the webhook answers 404.
  DIDIT_API_KEY: ${DIDIT_API_KEY:-}
  DIDIT_WORKFLOW_ID: ${DIDIT_WORKFLOW_ID:-}
  DIDIT_WEBHOOK_SECRET: ${DIDIT_WEBHOOK_SECRET:-}
  # Also needed for age verification: keys the duplicate-document check. 32 or more characters.
  IDENTITY_KEY_SECRET: ${IDENTITY_KEY_SECRET:-}
  # Safety (docs/safety/abuse-material-scanning.md): where alerts are emailed, the
  # PhotoDNA key once approved, and what purging Cloudflare's cache needs. Each
  # is optional; without them alerts are only logged, nothing is scanned and
  # nothing is purged.
  SAFETY_ALERT_EMAIL: ${SAFETY_ALERT_EMAIL:-}
  PHOTODNA_SUBSCRIPTION_KEY: ${PHOTODNA_SUBSCRIPTION_KEY:-}
  CLOUDFLARE_ZONE_ID: ${CLOUDFLARE_ZONE_ID:-}
  CLOUDFLARE_PURGE_TOKEN: ${CLOUDFLARE_PURGE_TOKEN:-}
  MEDIA_ORIGIN: ${MEDIA_ORIGIN:-}
  API_HOST: 0.0.0.0
  S3_ENDPOINT: ${S3_ENDPOINT:?}
  S3_REGION: ${S3_REGION:-auto}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
  S3_UPLOADS_BUCKET: ${S3_UPLOADS_BUCKET:?}
  S3_MEDIA_BUCKET: ${S3_MEDIA_BUCKET:?}

services:
  web:
    # Built by GitHub Actions and pulled from its registry; `build` is for local use.
    image: ${IMAGE_PREFIX:-heynaija}-web:${RELEASE:-latest}
    build:
      context: ../..
      target: web
    ports:
      # Loopback only: nginx on the host is the way in.
      - "127.0.0.1:${WEB_PORT:-3100}:3000"
    environment:
      API_INTERNAL_URL: http://api:4000
      KRATOS_INTERNAL_URL: http://kratos:4433
      # Absolute links in link previews (apps/web/lib/previews.ts).
      WEB_PUBLIC_URL: ${SITE_URL:?}
      # Copies of the web server sharing its port, each rendering on its own core
      # (apps/web/workers.mjs). Production's .env sets 4 for its 8 cores, leaving
      # the rest to Postgres, the API and Kratos. The default stays 1 so a server
      # whose cores are shared (staging) never gets more without being asked.
      WEB_WORKERS: ${WEB_WORKERS:-1}
      # Which release is running: a problem report on the ideas board says so.
      RELEASE: ${RELEASE:-latest}
    depends_on:
      api:
        condition: service_healthy
      kratos:
        condition: service_started
    restart: unless-stopped
    logging: *logging

  api:
    image: ${IMAGE_PREFIX:-heynaija}-api:${RELEASE:-latest}
    build:
      context: ../..
      target: api
    environment: *api-env
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    logging: *logging

  # Applies the app's database migrations, then exits. Runs on every deploy.
  migrate:
    image: ${IMAGE_PREFIX:-heynaija}-api:${RELEASE:-latest}
    command: ["node", "node_modules/@heynaija/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://heynaija:${POSTGRES_PASSWORD}@postgres:5432/heynaija
      # Empty (unset in .env) means the default of 5000; 0 disables.
      MIGRATE_LOCK_TIMEOUT_MS: ${MIGRATE_LOCK_TIMEOUT_MS:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    logging: *logging

  kratos-migrate:
    image: oryd/kratos:v26.2.0
    environment: &kratos-env
      DSN: postgres://heynaija:${POSTGRES_PASSWORD}@postgres:5432/kratos?sslmode=disable
      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE:?}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER:?}
      COURIER_SMTP_CONNECTION_URI: ${SMTP_CONNECTION_URI:?}
    volumes: &kratos-volumes
      - ../kratos/identity.schema.json:/etc/config/kratos/identity.schema.json:ro
      - ../kratos/invite-check.jsonnet:/etc/config/kratos/invite-check.jsonnet:ro
      - ../kratos/handle-change.jsonnet:/etc/config/kratos/handle-change.jsonnet:ro
      - ../kratos/google.jsonnet:/etc/config/kratos/google.jsonnet:ro
      - ../kratos/courier-templates:/etc/config/kratos/courier-templates:ro
    configs: &kratos-configs
      - source: kratos
        target: /etc/config/kratos/kratos.yml
    command: -c /etc/config/kratos/kratos.yml migrate sql -e --yes
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    logging: *logging

  # No --dev here: secure cookies and https only. --watch-courier sends the
  # verification and recovery emails through Resend.
  # Tagged with the contents of infra/kratos rather than the commit (deploy.sh
  # sets KRATOS_RELEASE), so other releases leave Kratos running.
  kratos:
    image: ${IMAGE_PREFIX:-heynaija}-kratos:${KRATOS_RELEASE:-latest}
    build:
      context: ../kratos
    environment: *kratos-env
    volumes: *kratos-volumes
    configs: *kratos-configs
    command: serve -c /etc/config/kratos/kratos.yml --watch-courier
    # deploy.sh sets this to a hash of Kratos's rendered config and its files, so
    # that a change to any of them recreates Kratos (Compose alone would not).
    labels:
      heynaija.kratos-inputs: ${KRATOS_INPUTS:-}
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    logging: *logging

  postgres:
    image: postgres:17-alpine
    # Memory settings, defaulting to production's 16 GB server (Postgres's stock
    # shared_buffers is 128MB): about a quarter of RAM for shared buffers, and
    # effective_cache_size telling the planner how much the OS will cache.
    # work_mem is per sort or hash, per query, so keep it modest.
    # Staging shares its server with Koinovera and sets smaller values in .env
    # (docs/deployment/staging.md). loadtest/compose.loadtest.yml repeats these.
    command:
      - postgres
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-4GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-10GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-512MB}
    # Docker's default 64 MB /dev/shm is too small for parallel queries once
    # shared_buffers is raised.
    shm_size: 256mb
    environment:
      POSTGRES_USER: heynaija
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: heynaija
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heynaija -d heynaija"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging: *logging

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped
    logging: *logging

volumes:
  postgres-data:
  redis-data:

configs:
  # Kratos for a real domain over https. Rendered here so the site address and
  # the webhook and Google secrets can be filled in; the dev version is
  # infra/kratos/kratos.yml.
  kratos:
    content: |
      version: v26.2.0

      serve:
        public:
          base_url: ${SITE_URL}/kratos/
        admin:
          base_url: http://kratos:4434/

      selfservice:
        default_browser_return_url: ${SITE_URL}/
        allowed_return_urls:
          - ${SITE_URL}
        # No passwords: an emailed one-time code, or Google.
        methods:
          password:
            enabled: false
          code:
            enabled: true
            passwordless_enabled: true
            config:
              lifespan: 15m
          # docs/deployment/google-sign-in.md
          oidc:
            enabled: ${GOOGLE_SIGN_IN:-false}
            config:
              providers:
                - id: google
                  provider: google
                  client_id: "${GOOGLE_CLIENT_ID:-}"
                  client_secret: "${GOOGLE_CLIENT_SECRET:-}"
                  mapper_url: file:///etc/config/kratos/google.jsonnet
                  scope: [openid, email]
        flows:
          error:
            ui_url: ${SITE_URL}/auth-error
          login:
            ui_url: ${SITE_URL}/login
            lifespan: 15m
          registration:
            ui_url: ${SITE_URL}/signup
            lifespan: 15m
            # Email and handle go with "Email me a code" in one step (infra/kratos/kratos.yml).
            enable_legacy_one_step: true
            # Invite-only signup: see the comments in infra/compose/docker-compose.dev.yml.
            after:
              code:
                hooks: &signup-hooks
                  - hook: web_hook
                    config:
                      url: http://api:4000/internal/kratos/registration
                      method: POST
                      body: file:///etc/config/kratos/invite-check.jsonnet
                      auth: &webhook-auth
                        type: api_key
                        config:
                          name: x-webhook-secret
                          value: ${KRATOS_WEBHOOK_SECRET}
                          in: header
                      response:
                        parse: true
                  - hook: web_hook
                    config:
                      url: http://api:4000/internal/kratos/registered
                      method: POST
                      body: file:///etc/config/kratos/invite-check.jsonnet
                      auth:
                        type: api_key
                        config:
                          name: x-webhook-secret
                          value: ${KRATOS_WEBHOOK_SECRET}
                          in: header
                  - hook: session
              oidc:
                hooks: *signup-hooks
          verification:
            enabled: true
            ui_url: ${SITE_URL}/verification
            use: code
            after:
              default_browser_return_url: ${SITE_URL}/
          # Signing in with an emailed code already gets a member back in.
          recovery:
            enabled: false
          settings:
            ui_url: ${SITE_URL}/settings
            privileged_session_max_age: 15m
            # Handles given up by renaming: see docker-compose.dev.yml.
            after:
              profile:
                hooks:
                  - hook: web_hook
                    config:
                      url: http://api:4000/internal/kratos/settings
                      method: POST
                      body: file:///etc/config/kratos/handle-change.jsonnet
                      auth: *webhook-auth
                      response:
                        parse: true
          logout:
            after:
              default_browser_return_url: ${SITE_URL}/

      session:
        lifespan: 336h
        cookie:
          name: hn_session
          same_site: Lax

      hashers:
        algorithm: bcrypt
        bcrypt:
          cost: 12

      ciphers:
        algorithm: xchacha20-poly1305

      identity:
        default_schema_id: member
        schemas:
          - id: member
            url: file:///etc/config/kratos/identity.schema.json

      courier:
        template_override_path: /etc/config/kratos/courier-templates
        smtp:
          # The connection URI (with the Resend API key) comes from the environment.
          from_address: ${SMTP_FROM_ADDRESS:?}
          from_name: ${SMTP_FROM_NAME:-HeyNaija}

      # Never "info" or "debug" here: at those levels Kratos logs webhook request
      # headers, which carry the webhook secret.
      log:
        level: warning
        format: json
        leak_sensitive_values: false

      feature_flags:
        use_continue_with_transitions: true
