# Ory Kratos — local development configuration.
# Secrets, the database DSN and the registration hooks (which carry the webhook
# secret) are injected as environment variables by docker-compose.dev.yml.
#
# Browsers reach Kratos through the web app's /kratos proxy, so every URL here is
# on the web app's origin and the session cookie is first-party.

version: v26.2.0

serve:
  public:
    base_url: http://127.0.0.1:3000/kratos/
  admin:
    base_url: http://kratos:4434/

selfservice:
  default_browser_return_url: http://127.0.0.1:3000/
  allowed_return_urls:
    - http://127.0.0.1:3000

  # No passwords: members sign up and sign in with a one-time code sent to their
  # email, or with Google.
  methods:
    password:
      enabled: false
    code:
      enabled: true
      passwordless_enabled: true
      config:
        lifespan: 15m
    # Google: the provider and on/off switch are in docker-compose.dev.yml, which
    # fills in the client ID and secret.
    oidc:
      enabled: false

  flows:
    error:
      ui_url: http://127.0.0.1:3000/auth-error

    login:
      ui_url: http://127.0.0.1:3000/login
      lifespan: 15m

    registration:
      ui_url: http://127.0.0.1:3000/signup
      lifespan: 15m
      # Email and handle go with "Email me a code" in one step. Without this,
      # Kratos asks for them, then asks again how to sign in, then sends the code.
      enable_legacy_one_step: true
      # The hooks live in docker-compose.dev.yml (they hold a secret): invite check
      # via webhook to our API, then a session. The emailed code (or Google)
      # already proves the address, so there is no separate verification step.

    verification:
      enabled: true
      ui_url: http://127.0.0.1:3000/verification
      use: code
      after:
        default_browser_return_url: http://127.0.0.1:3000/

    # Signing in with an emailed code already gets a member back in.
    recovery:
      enabled: false

    settings:
      ui_url: http://127.0.0.1:3000/settings
      privileged_session_max_age: 15m

    logout:
      after:
        default_browser_return_url: http://127.0.0.1:3000/

session:
  lifespan: 336h # 14 days
  cookie:
    name: hn_session
    same_site: Lax

hashers:
  algorithm: bcrypt
  bcrypt:
    cost: 12

ciphers:
  algorithm: xchacha20-poly1305

identity:
  default_schema_id: member
  schemas:
    - id: member
      url: file:///etc/config/kratos/identity.schema.json

courier:
  smtp:
    connection_uri: smtp://mailpit:1025/?disable_starttls=true
    from_address: no-reply@heynaija.test
    from_name: heynaija

log:
  level: info
  format: text

feature_flags:
  use_continue_with_transitions: true
