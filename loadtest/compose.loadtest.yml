# Overlay for a THROWAWAY load-test copy of the production stack, on a rented
# server of production's size. Never use it on staging or production.
#
#   docker compose --env-file infra/deploy/.env \
#     -f infra/deploy/compose.yml -f loadtest/compose.loadtest.yml up -d --build --wait
#
# What it changes (docs/loadtest.md):
#   - Postgres names itself heynaija-loadtest (the seed script's safety check),
#     loads pg_stat_statements, keeps full query text and logs slow statements.
#   - Email goes to Mailpit, so sessions.mjs can read sign-in codes.
#   - Postgres, the Kratos admin API and Mailpit are published on loopback only,
#     for the seed and session scripts run on the server.
#   - The web app is published on all interfaces at port 3100, for the separate
#     load-generator machine. Firewall it to that machine's IP.
name: heynaija-loadtest

services:
  web:
    ports: !override
      - "0.0.0.0:3100:3000"

  postgres:
    command:
      - postgres
      # Same memory settings as infra/deploy/compose.yml (this list replaces its).
      - -c
      - shared_buffers=${POSTGRES_SHARED_BUFFERS:-2GB}
      - -c
      - effective_cache_size=${POSTGRES_EFFECTIVE_CACHE_SIZE:-5GB}
      - -c
      - work_mem=${POSTGRES_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - cluster_name=heynaija-loadtest
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=top
      - -c
      - track_activity_query_size=8192
      - -c
      - log_min_duration_statement=250
    ports:
      - "127.0.0.1:5432:5432"

  kratos:
    ports:
      - "127.0.0.1:4434:4434"

  mailpit:
    image: axllent/mailpit:v1.31.5
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped
